<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduro Bike Bergamo</title>
    <style>
        :root {
            --main-bg: #211f20;
            --accent: #ff3300; /* arancione da aggiungere se vuoi */
            --text-light: #ffffff;
            --border-gray: #cccccc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-light);
        }
        header {
            background: var(--main-bg);
            color: var(--text-light);
            text-align: center;
        }
        nav {
            background: #333;
        }
        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            display: inline-block;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .hero {
            text-align: center;
            color: var(--text-light);
            background-color: var(--main-bg);
            padding: 2rem 1rem;
        }
        .hero h1 {
            margin: 0;
        }
        section {
            text-align: center;
            background-color: var(--main-bg);
            padding: 2rem 1rem;
        }
        .bikes, .contacts, .trails, .electric-motos {
            background-color: var(--main-bg);
        }
        .bike-card, .trail-card, .moto-card {
            border: 1px solid var(--border-gray);
            background: var(--main-bg);
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
        }
        .bike-card img, .trail-card img, .moto-card img {
            width: 100%;
            height: auto;
            background-color: var(--main-bg);
        }
        footer {
            background: var(--main-bg);
            text-align: center;
            color: var(--text-light);
            padding: 1rem;
        }
    </style>
</head>
<body>
    <!-- CONTENUTO DEL SITO QUI (lasciato intatto) -->
</body>
</html>
