<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enduro Bike Bergamo</title>

<!-- FONT SPORTIVO -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'Bebas Neue', Arial, sans-serif;
}

/* HERO FULLSCREEN */
.hero {
    position: relative;
    height: 100vh;
    background-image:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url("casco.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* LOGO IN ALTO */
.hero-logo {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
}

.hero-logo img {
    width: 220px;
    max-width: 80%;
}

/* TESTO IN BASSO SOVRAPPOSTO */
.hero-text {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    padding: 0 20px;
}

.hero-text h1 {
    font-size: clamp(32px, 6vw, 64px);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 0;
    color: white;
}

/* NAV */
nav {
    background: black;
    padding: 15px 0;
    text-align: center;
}

nav a {
    color: #ff6600;
    margin: 0 15px;
    text-decoration: none;
    font-size: 18px;
}

nav a:hover {
    text-decoration: underline;
}

/* SEZIONI */
section {
    padding: 60px 20px;
    text-align: center;
    background: black;
}

h2 {
    color: #ff6600;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.card {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #222;
    font-family: Arial, sans-serif;
    color: #ddd;
}

/* MOBILE FIX */
@media (max-width: 768px) {
    .hero {
        background-attachment: scroll;
    }
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">

    <!-- LOGO -->
    <div class="hero-logo">
        <img src="logo2.jpeg" alt="Enduro Bike Bergamo">
    </div>

    <!-- TESTO IN BASSO -->
    <div class="hero-text">
        <h1>Vivi l’emozione dell’enduro in Bergamasca</h1>
    </div>

</div>

<!-- NAV -->
<nav>
    <a href="#about">Chi siamo</a>
    <a href="#bikes">Bici</a>
    <a href="#electric">Moto elettriche</a>
    <a href="#contacts">Contatti</a>
</nav>

<!-- CONTENUTO -->
<section id="about">
    <h2>Chi siamo</h2>
    <div class="card">
        Passione, off-road ed elettrico.<br>
        Enduro Bike Bergamo è adrenalina pura.
    </div>
</section>

<section id="contacts">
    <h2>Contatti</h2>
    <div class="card">
        info@endurobikebergamo.it<br>
        Bergamo
    </div>
</section>

</body>
</html>
