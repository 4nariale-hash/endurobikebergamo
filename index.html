<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enduro Bike Bergamo</title>

<!-- FONT SPORTIVO -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'Bebas Neue', Arial, sans-serif;
}

/* HERO FULLSCREEN */
.hero {
    height: 100vh;
    background-image:
        linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.6)),
        url("casco.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
}

/* PARTE ALTA */
.hero-top img {
    width: 220px;
    max-width: 80%;
}

.hero-top h1 {
    margin-top: 15px;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ff6600;
}

/* PARTE BASSA */
.hero-bottom {
    width: 100%;
    padding-bottom: 30px;
}

.hero-bottom h2 {
    font-size: clamp(32px, 6vw, 64px);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 0;
    color: white;
}

/* NAV */
nav {
    background: black;
    padding: 15px 0;
    text-align: center;
}

nav a {
    color: #ff6600;
    margin: 0 15px;
    text-decoration: none;
    font-size: 18px;
}

nav a:hover {
    text-decoration: underline;
}

/* SEZIONI */
section {
    padding: 60px 20px;
    text-align: center;
    background: black;
}

h3 {
    color: #ff6600;
    text-transform: uppercase;
    letter-spacing: 3px;
}

.card {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #222;
    font-family: Arial, sans-serif;
    color: #ddd;
}

/* MOBILE FIX */
@media (max-width: 768px) {
    .hero {
        background-attachment: scroll;
    }
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">

    <!-- ALTO -->
    <div class="hero-top">
        <img src="logo2.jpeg" alt="Enduro Bike Bergamo">
        <h1>Enduro Bike Bergamo</h1>
    </div>

    <!-- BASSO -->
    <div class="hero-bottom">
        <h2>Vivi l’emozione dell’enduro in Bergamasca</h2>
    </div>

</div>

<!-- NAV -->
<nav>
    <a href="#about">Chi siamo</a>
    <a href="#bikes">Bici</a>
    <a href="#electric">Moto elettriche</a>
    <a href="#contacts">Contatti</a>
</nav>

<!-- CONTENUTO -->
<section id="about">
    <h3>Chi siamo</h3>
    <div class="card">
        Passione, off-road ed elettrico.  
        Enduro Bike Bergamo è adrenalina pura.
    </div>
</section>

<section id="contacts">
    <h3>Contatti</h3>
    <div class="card">
        info@endurobikebergamo.it<br>
        Bergamo
    </div>
</section>

</body>
</html>
